<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" role="img" aria-label="OB Distributions supply network">
  <rect width="1600" height="1000" fill="#0a0a0a"/>

  <!-- faint hairline grid -->
  <g stroke="#333333" stroke-width="1" opacity="0.5">
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600"/>
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <!-- distribution network: hub + spokes -->
  <g stroke="#333333" stroke-width="1.5">
    <line x1="800" y1="500" x2="320" y2="240"/>
    <line x1="800" y1="500" x2="360" y2="720"/>
    <line x1="800" y1="500" x2="1240" y2="250"/>
    <line x1="800" y1="500" x2="1280" y2="700"/>
    <line x1="800" y1="500" x2="800" y2="160"/>
    <line x1="800" y1="500" x2="800" y2="840"/>
    <line x1="320" y1="240" x2="800" y2="160"/>
    <line x1="1240" y1="250" x2="800" y2="160"/>
    <line x1="360" y1="720" x2="800" y2="840"/>
    <line x1="1280" y1="700" x2="800" y2="840"/>
  </g>

  <!-- crate / shelf glyphs at nodes -->
  <g stroke="#dadada" stroke-width="2" fill="none" opacity="0.85">
    <rect x="286" y="206" width="68" height="68" rx="4"/>
    <rect x="326" y="686" width="68" height="68" rx="4"/>
    <rect x="1206" y="216" width="68" height="68" rx="4"/>
    <rect x="1246" y="666" width="68" height="68" rx="4"/>
    <rect x="766" y="126" width="68" height="68" rx="4"/>
    <rect x="766" y="806" width="68" height="68" rx="4"/>
  </g>

  <!-- central hub: gold, the single flare -->
  <circle cx="800" cy="500" r="70" stroke="#FBBF24" stroke-width="2.5" fill="#161618"/>
  <path d="M770 500a30 30 0 1 1 60 0 30 30 0 0 1-60 0Z" stroke="#FBBF24" stroke-width="2.5" fill="none"/>
  <path d="M834 486h20a16 16 0 0 1 0 32h-20v-32Zm0 32h22a16 16 0 0 1 0 32h-22v-32Z" fill="none"/>

  <!-- gold accent dots on select nodes -->
  <g fill="#FBBF24">
    <circle cx="320" cy="240" r="6"/>
    <circle cx="1280" cy="700" r="6"/>
    <circle cx="800" cy="160" r="6"/>
  </g>
</svg>
