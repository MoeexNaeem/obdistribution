<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" role="img" aria-label="OB Distributions — built to scale">
  <defs>
    <linearGradient id="sc-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sc-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#f97316" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sc-pale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sc-glow" cx="50%" cy="58%" r="60%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7a4a06" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sc-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="sc-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1a1a1e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a0a"/>
  <rect width="1600" height="1000" fill="url(#sc-grid)"/>
  <rect width="1600" height="1000" fill="url(#sc-glow)"/>

  <!-- Flowing gold ribbons spanning the full height so the frame is never empty -->
  <g fill="none" stroke-linecap="round" filter="url(#sc-blur)">
    <path d="M-160 260 C 320 160 700 380 1000 260 S 1520 140 1760 240" stroke="url(#sc-pale)" stroke-width="46"/>
    <path d="M-160 430 C 340 300 720 560 1120 420 S 1560 280 1760 410" stroke="url(#sc-gold)" stroke-width="90"/>
    <path d="M-160 580 C 300 460 640 740 980 580 S 1500 420 1760 540" stroke="url(#sc-amber)" stroke-width="76"/>
    <path d="M-160 730 C 380 620 820 860 1180 700 S 1560 560 1760 690" stroke="url(#sc-gold)" stroke-width="60"/>
    <path d="M-160 850 C 340 780 760 940 1120 840 S 1560 720 1760 830" stroke="url(#sc-amber)" stroke-width="40"/>
  </g>

  <!-- Crisp structural line + nodes for contrast against the soft ribbons -->
  <path d="M120 180 C 560 90 1040 90 1480 180" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.45"/>
  <g fill="#fbbf24">
    <circle cx="120" cy="180" r="4"/>
    <circle cx="800" cy="128" r="4"/>
    <circle cx="1480" cy="180" r="4"/>
  </g>
</svg>
